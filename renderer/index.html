<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCMR Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 1000px;
            width: 90%;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .login-form {
            max-width: 400px;
            margin: 0 auto 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 10px;
        }
        
        .btn:hover {
            background: #5a6fd8;
        }
        
        .system-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        
        .info-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }
        
        .hidden {
            display: none;
        }
        
        .dashboard {
            text-align: left;
        }
        
        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #e1e5e9;
            margin-bottom: 20px;
        }
        
        .nav-tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            min-height: 300px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen">
            <div class="logo">AgentCMR Desktop</div>
            <div class="subtitle">System zarządzania ubezpieczeniami</div>
            
            <div class="login-form">
                <div class="form-group">
                    <label for="username">Nazwa użytkownika:</label>
                    <input type="text" id="username" value="admin" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Hasło:</label>
                    <input type="password" id="password" value="admin123" required>
                </div>
                
                <div class="form-group">
                    <label for="mode">Tryb pracy:</label>
                    <select id="mode">
                        <option value="standalone">Standalone (lokalny)</option>
                        <option value="server">Serwer (udostępnianie w sieci)</option>
                        <option value="client">Klient (połączenie z serwerem)</option>
                    </select>
                </div>
                
                <button class="btn" onclick="login()">Zaloguj się</button>
            </div>
            
            <div id="systemInfo" class="system-info">
                <h3>Informacje o systemie:</h3>
                <div id="systemDetails"></div>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="dashboard hidden">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showTab('overview')">Przegląd</button>
                <button class="nav-tab" onclick="showTab('clients')">Klienci</button>
                <button class="nav-tab" onclick="showTab('policies')">Polisy</button>
                <button class="nav-tab" onclick="showTab('vehicles')">Pojazdy</button>
                <button class="nav-tab" onclick="showTab('settings')">Ustawienia</button>
            </div>
            
            <div id="tabContent" class="tab-content">
                <!-- Content will be loaded here -->
            </div>
            
            <button class="btn" onclick="logout()" style="float: right;">Wyloguj</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        
        let currentUser = null
        let systemInfo = null
        
        window.addEventListener('DOMContentLoaded', () => {
            loadSystemInfo()
        })
        
        ipcRenderer.on('system-info', (event, info) => {
            systemInfo = info
            displaySystemInfo(info)
        })
        
        async function loadSystemInfo() {
            try {
                const info = await ipcRenderer.invoke('get-system-info')
                systemInfo = info
                displaySystemInfo(info)
            } catch (error) {
                console.error('Failed to load system info:', error)
            }
        }
        
        function displaySystemInfo(info) {
            const container = document.getElementById('systemDetails')
            container.innerHTML = `
                <div class="info-item"><strong>Komputer:</strong> ${info.hostname}</div>
                <div class="info-item"><strong>System:</strong> ${info.platform} (${info.arch})</div>
                <div class="info-item"><strong>Użytkownik:</strong> ${info.userInfo.username}</div>
                <div class="info-item"><strong>Adresy IP:</strong> ${info.networkInterfaces.map(ni => `${ni.name}: ${ni.address}`).join(', ')}</div>
            `
        }
        
        function login() {
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            const mode = document.getElementById('mode').value
            
            if (username === 'admin' && password === 'admin123') {
                currentUser = { username, mode }
                document.getElementById('loginScreen').classList.add('hidden')
                document.getElementById('dashboard').classList.remove('hidden')
                showTab('overview')
            } else {
                alert('Nieprawidłowe dane logowania!')
            }
        }
        
        function logout() {
            currentUser = null
            document.getElementById('dashboard').classList.add('hidden')
            document.getElementById('loginScreen').classList.remove('hidden')
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active')
            })
            event.target.classList.add('active')
            
            const content = document.getElementById('tabContent')
            
            switch(tabName) {
                case 'overview':
                    content.innerHTML = `
                        <h2>Przegląd systemu</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number">156</div>
                                <div class="stat-label">Aktywne polisy</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">89</div>
                                <div class="stat-label">Klienci</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">234</div>
                                <div class="stat-label">Pojazdy</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">12</div>
                                <div class="stat-label">Wygasające polisy</div>
                            </div>
                        </div>
                        <p><strong>Tryb pracy:</strong> ${currentUser.mode}</p>
                        <p><strong>Status:</strong> Aplikacja działa lokalnie bez serwera web</p>
                    `
                    break
                case 'clients':
                    content.innerHTML = `
                        <h2>Zarządzanie klientami</h2>
                        <button class="btn">Dodaj klienta</button>
                        <p>Lista klientów będzie tutaj wyświetlana...</p>
                    `
                    break
                case 'policies':
                    content.innerHTML = `
                        <h2>Zarządzanie polisami</h2>
                        <button class="btn">Nowa polisa</button>
                        <p>Lista polis będzie tutaj wyświetlana...</p>
                    `
                    break
                case 'vehicles':
                    content.innerHTML = `
                        <h2>Zarządzanie pojazdami</h2>
                        <button class="btn">Dodaj pojazd</button>
                        <p>Lista pojazdów będzie tutaj wyświetlana...</p>
                    `
                    break
                case 'settings':
                    content.innerHTML = `
                        <h2>Ustawienia aplikacji</h2>
                        <div class="form-group">
                            <label>Tryb pracy: ${currentUser.mode}</label>
                        </div>
                        <div class="system-info">
                            <h3>Informacje o systemie:</h3>
                            ${systemInfo ? `
                                <div class="info-item"><strong>Komputer:</strong> ${systemInfo.hostname}</div>
                                <div class="info-item"><strong>System:</strong> ${systemInfo.platform}</div>
                                <div class="info-item"><strong>Użytkownik:</strong> ${systemInfo.userInfo.username}</div>
                            ` : 'Ładowanie...'}
                        </div>
                    `
                    break
            }
        }
    </script>
</body>
</html>
